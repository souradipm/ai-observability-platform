spring.application.name=ai-observability-platform
logging.level.root=INFO
logging.level.com.aiobservability.platform=DEBUG
app.environment=dev

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.max.block.ms=5000

spring.elasticsearch.uris=http://localhost:9200

# Actuator endpoint exposure
management.endpoints.web.exposure.include=health,info,metrics

# Application information
management.info.env.enabled=true

info.app.name=AI Observability Platform
info.app.description=Observability and AI-powered incident investigation
info.app.version=0.1.0

